name: CI Tests - Next.js

on:
  workflow_call:  # Called by ci-test.yml when Next.js project is detected

jobs:
  test:
    name: Test (Node.js ${{ matrix.node-version }})
    runs-on: [self-hosted, hp, linux, x64]

    strategy:
      matrix:
        node-version: ["18.x", "20.x", "21.x"]
      fail-fast: false  # Test all versions even if one fails

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node-${{ matrix.node-version }}-
            npm-${{ runner.os }}-

      - name: Display Node.js version
        run: node --version

      - name: Install dependencies
        run: npm ci

      - name: Display installed package versions
        run: |
          echo "## 📦 Installed Package Versions (Node.js ${{ matrix.node-version }})" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          npm list --depth=0 | grep -E "(next|react|typescript|firebase)" >> $GITHUB_STEP_SUMMARY || echo "Dependencies installed" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: false

      - name: Generate environment file (mirror local)
        run: |
          echo "# Auto-generated by CI" > .env.local
          echo "# Generated at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> .env.local
          echo "" >> .env.local
          echo "✅ .env.local generated with $(grep -c '^[^#]' .env.local) variables"

      - name: Build Next.js application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify Next.js build output
        run: |
          test -d .next && echo "✅ Build output exists" || exit 1
          echo "### ✅ Next.js Build Successful" >> $GITHUB_STEP_SUMMARY

      # Optional: Run tests if test script exists
      # - name: Run tests
      #   run: npm test
      #   continue-on-error: false

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-node-${{ matrix.node-version }}
          path: |
            .next/
          retention-days: 7

  test-summary:
    name: Test Summary
    runs-on: [self-hosted, hp, linux, x64]
    needs: test
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" == "failure" ] || [ "${{ needs.test.result }}" == "cancelled" ]; then
            echo "❌ Tests failed or were cancelled" >> $GITHUB_STEP_SUMMARY
            echo "Tests failed or were cancelled"
            exit 1
          fi
          echo "✅ All tests passed successfully across Node.js 18.x, 20.x, and 21.x" >> $GITHUB_STEP_SUMMARY
          echo "All tests passed successfully"

